<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NihonGo - Study Lab has moved</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#bd2828" />
<link rel="icon" href="/nihongo/icons/icon-192.png" />
<link rel="manifest" href="/nihongo/manifest.webmanifest" />
<script src="/nihongo/redirect.js"></script>
<script>
  // Redirect immediately, keeping any query/hash. Unconfigured target => show notice instead.
  (function () {
    var ok = typeof TARGET === "string" && TARGET.indexOf("REPLACE") === -1;
    window.__nihongoTarget = ok ? TARGET + "/" + location.search + location.hash : null;
    if (ok) location.replace(window.__nihongoTarget);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f2;color:#2e2b27;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  @media(prefers-color-scheme:dark){body{background:#000;color:#e9e9e9}}
  img{width:72px;height:72px}
  a.btn{display:inline-block;margin-top:16px;background:#dc1414;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:600}
  p{max-width:340px;margin:12px auto 0;line-height:1.5;opacity:.85}
</style>
</head>
<body>
<main>
  <img src="/nihongo/icons/icon-192.png" alt="NihonGo" />
  <h1>NihonGo - Study Lab has moved</h1>
  <p>Redirecting you to the new site…</p>
  <p id="msg"></p>
  <a id="go" class="btn" href="#">Open the new site</a>
</main>
<script>
  var go = document.getElementById("go");
  if (window.__nihongoTarget) { go.href = window.__nihongoTarget; }
  else { go.style.display = "none"; document.getElementById("msg").textContent = "Redirect target is not configured yet (docs/redirect.js)."; }
</script>
<noscript><meta http-equiv="refresh" content="0" /></noscript>
</body>
</html>
